<!doctype html>
<html lang="zh-Hant-HK"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070812">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Soluna">
<link rel="manifest" href="manifest.webmanifest">
<script src="firebase-config.js"></script>
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>html,body{margin:0;padding:0}body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}</style>
</head><body>
<title>Soluna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Manrope:wght@300;400;500;600&family=Noto+Serif+TC:wght@300;400;600;900&family=Noto+Sans+TC:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one phone-width column, hairline ink on paper; one bold natal wheel on the Today view, everything else quiet. */
:root{
  /* Soluna (Figma v2): midnight indigo, lavender moonlight, mist panel. Single dark look by design. */
  --bg:#070812; --surface:#11121f; --surface2:#141526; --fg:#f4f2ff; --mute:#a4a3ad; --mute2:#c4c1cc; --line:rgba(255,255,255,.09); --soft:#151628;
  --gold:#c9c7f4; --gold2:#d6d4f5; --gold3:#bbb9eb; --sand:#d8d8ec; --ink:#161622; --hi:#d6d4f5; --hi-fg:#11111d;
  --f-display:"Cormorant Garamond","Noto Serif TC","Songti TC",serif;
  --f-body:"Manrope","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-latin:"Cormorant Garamond","Noto Serif TC",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --nav-h:62px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;font-weight:300;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding-block:14px 12px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:900;font-size:20px;letter-spacing:.3em}
.brand{display:flex;align-items:baseline;gap:10px}
.brand em{font-family:var(--f-latin);font-style:italic;font-weight:500;font-size:17px;letter-spacing:.02em;color:var(--mute)}
.today-date{font-family:var(--f-mono);font-size:11.5px;color:var(--mute);text-align:right;letter-spacing:.06em;line-height:1.4}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:28px;line-height:1.3;font-weight:900}
h2{font-size:19px;font-weight:600;line-height:1.35}
h3{font-size:15.5px;font-weight:600}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.mute{color:var(--mute)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
section.view{display:flex;flex-direction:column;gap:28px;padding-top:22px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rule{border:0;border-top:1px solid var(--line);margin:0}
.demo-banner{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px dashed var(--fg);padding:10px 12px;font-size:13px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--fg);background:transparent;padding:9px 16px;font-size:14px;letter-spacing:.04em;border-radius:0;transition:background .15s,color .15s}
.btn:hover{background:var(--fg);color:var(--bg)}
.btn.solid{background:var(--hi);color:var(--hi-fg)}
.btn.solid:hover{opacity:.85}
.btn.small{padding:5px 10px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.seg{display:flex;border:1px solid var(--fg);overflow-x:auto}
.seg button{flex:1;min-width:64px;border:0;background:transparent;padding:8px 6px;font-size:13px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--fg)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips button{border:1px solid var(--line);background:transparent;padding:6px 12px;font-size:13px;white-space:nowrap;border-radius:999px}
.chips button[aria-pressed="true"]{border-color:var(--fg);background:var(--fg);color:var(--bg)}

/* Cosmos */
#dust{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
body{position:relative;z-index:0}
.brand .logo{width:22px;height:22px;align-self:center}
.hero .orrery{position:absolute;right:-34%;top:50%;transform:translateY(-50%);width:88%;max-width:none;height:auto;z-index:-1;opacity:.5;pointer-events:none}
.hero .orrery .o{fill:none;stroke:var(--bg);stroke-width:.6}
.hero .orrery .p{fill:var(--bg)}
.hero .orrery text{fill:var(--bg);font-size:9.5px;font-family:var(--f-body)}
.hero .orb{position:absolute;inset:auto;right:-22%;top:-26%;left:auto;bottom:auto;width:72%;height:auto;aspect-ratio:1;max-width:none;z-index:-1;opacity:.55}
.orbit-orn{display:flex;align-items:center;gap:12px}
.orbit-orn::before,.orbit-orn::after{content:"";flex:1;border-top:1px solid var(--line)}
.orbit-orn svg{width:46px;height:16px}
nav.tabs a{position:relative}
nav.tabs a[aria-current="page"]::before{content:"";position:absolute;top:6px;width:5px;height:5px;border-radius:50%;background:var(--fg);box-shadow:0 0 0 3px color-mix(in srgb,var(--fg) 14%,transparent)}
header.top{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(8px)}
.view>h1,.view .stack>h1{position:relative}
.chart-orb{position:absolute;right:-8px;top:-14px;width:120px;height:120px;z-index:-1;opacity:.75;pointer-events:none}
.sec-planet{width:100%;height:auto;display:block;max-width:100%}
/* Today */
.hero{position:relative;overflow:hidden;background:var(--fg);color:var(--bg);padding:22px 20px 24px;display:flex;flex-direction:column;gap:14px;isolation:isolate}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero .eyebrow{color:color-mix(in srgb,var(--bg) 70%,var(--fg))}
.hero .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero .moon svg{width:64px;height:64px;display:block}
.hero .headline{color:var(--bg)}
.hero .big-date{font-family:var(--f-latin);font-style:italic;font-size:43px;line-height:.9;font-weight:500}
.hero p.body{color:color-mix(in srgb,var(--bg) 86%,var(--fg));font-size:14.5px}
.orn{display:flex;align-items:center;gap:12px;color:var(--fg)}
.orn::before,.orn::after{content:"";flex:1;border-top:1px solid var(--line)}
.orn svg{width:14px;height:14px}
.orn span{font-family:var(--f-latin);font-style:italic;font-size:16.5px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--fg);border-left:1px solid var(--fg)}
.tiles button{border:0;border-right:1px solid var(--fg);border-bottom:1px solid var(--fg);background:var(--bg);padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:background .15s,color .15s}
.tiles button svg{width:40px;height:40px}
.tiles button svg *{stroke:currentColor;fill:none;stroke-width:1.2}
.tiles button svg .f{fill:currentColor;stroke:none}
.tiles button b{font-family:var(--f-display);font-size:15px;font-weight:600;line-height:1.2}
.tiles button small{font-family:var(--f-latin);font-style:italic;font-size:13px;color:var(--mute)}
.tiles button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.tiles button[aria-pressed="true"] small{color:var(--bg)}
.tiles button:hover:not([aria-pressed="true"]){background:var(--soft)}
h1 .lat{font-family:var(--f-latin);font-style:italic;font-weight:500;font-size:.8em;color:var(--mute);margin-left:8px}
.wheel-box{display:flex;justify-content:center}
.wheel-box svg{width:100%;max-width:360px;height:auto}
.wheel-box text{font-family:var(--f-body);fill:var(--fg)}
.headline{font-family:var(--f-display);font-size:25px;font-weight:900;line-height:1.35}
.yiji{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--fg);border-bottom:1px solid var(--fg)}
.yiji>div{padding:12px 0}
.yiji>div+div{border-left:1px solid var(--line);padding-left:14px}
.yiji .big{font-family:var(--f-display);font-size:24px;font-weight:900;line-height:1}
.yiji ul{list-style:none;margin:8px 0 0;padding:0;font-size:14px}
.yiji li{padding:3px 0}
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.meter{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.dots{display:flex;gap:3px}
.dots i{width:9px;height:9px;border:1px solid var(--fg);border-radius:50%;display:block}
.dots i.on{background:var(--fg)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--mute)}
.kv dd{margin:0}
.note{font-size:13px;color:var(--mute);border-left:2px solid var(--line);padding-left:10px}

.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sw{display:flex;flex-direction:column;gap:6px}
.sw i{display:block;height:54px;border:1px solid var(--fg)}
.sw.avoid i{position:relative;overflow:hidden}
.sw.avoid i::after{content:"";position:absolute;left:-10%;top:50%;width:120%;border-top:1.5px solid var(--fg);transform:rotate(-22deg);mix-blend-mode:difference;border-color:#fff}
.sw b{font-family:var(--f-display);font-size:16px;line-height:1.1}
.cdot{display:inline-block;width:10px;height:10px;border-radius:50%;border:1px solid var(--fg);vertical-align:-1px;margin-right:4px}
/* AI output */
.ai{border-top:1px solid var(--fg);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.ai-out{font-size:15px;min-width:0}
.ai-out h4{font-family:var(--f-display);font-size:16.5px;margin:14px 0 4px}
.ai-out p{margin:0 0 10px}
.ai-out ul{margin:0 0 10px;padding-left:20px}
.ai-out:empty{display:none}
.thinking{font-family:var(--f-mono);font-size:11.5px;color:var(--mute);letter-spacing:.1em;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}

/* Forecast */
.daylist{display:flex;flex-direction:column}
.dayrow{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.dayrow .d{font-family:var(--f-mono);font-size:11.5px;line-height:1.3}
.dayrow .d b{font-family:var(--f-display);font-size:18px;display:block}
.dayrow.now{background:var(--soft);margin:0 -10px;padding:12px 10px}
.bar{height:4px;background:var(--line);position:relative;margin-top:6px}
.bar span{position:absolute;inset:0 auto 0 0;background:var(--fg)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal div{aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--line);position:relative}
.cal div.h{font-family:var(--f-body);border:0;aspect-ratio:auto;color:var(--mute);font-size:11.5px}
.cal div.empty{border:0}
.cal div[data-l="5"],.cal div[data-l="4"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cal div[data-l="3"]{background:var(--soft);border-color:var(--fg)}
.cal div.today::after{content:"";position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:currentColor}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--mute);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border:1px solid var(--fg);margin-right:5px;vertical-align:-1px}
.legend .l5::before{background:var(--fg)}
.legend .l3::before{background:var(--soft)}
.months{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.months div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 8px;font-size:11.5px;display:flex;flex-direction:column;gap:2px}
.months b{font-family:var(--f-display);font-size:16px}
.months .now{background:var(--fg);color:var(--bg)}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:70px 54px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.tl .gz{font-family:var(--f-display);font-size:22px;font-weight:900;line-height:1.1}
.tl.now{border:1px solid var(--fg);padding:14px 10px;margin:4px -10px}
.tl .age{font-family:var(--f-mono);font-size:11.5px;line-height:1.4}

/* Chart */
.pillars{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--fg)}
.pillar{text-align:center;padding:10px 4px;display:flex;flex-direction:column;gap:2px}
.pillar+.pillar{border-left:1px solid var(--line)}
.pillar .lbl{font-size:11.5px;color:var(--mute)}
.pillar .g{font-family:var(--f-display);font-size:31px;font-weight:900;line-height:1.15}
.pillar .tg{font-size:11.5px;font-family:var(--f-mono)}
.pillar.dm .g:first-of-type{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px}
.elbars{display:flex;flex-direction:column;gap:8px}
.elbar{display:grid;grid-template-columns:28px 1fr 22px;gap:10px;align-items:center;font-size:14px}
.elbar .track{height:10px;border:1px solid var(--fg);position:relative}
.elbar .track span{position:absolute;inset:0 auto 0 0;background:var(--fg)}
.planets{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line)}
.planets div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;gap:8px}
.planets div:nth-child(odd){padding-right:12px}
.planets div:nth-child(even){padding-left:12px;border-left:1px solid var(--line)}
.ziwei-scroll{overflow-x:auto}
.ziwei{display:grid;grid-template-columns:repeat(4,minmax(86px,1fr));grid-template-rows:repeat(4,minmax(150px,auto));border:1px solid var(--fg);min-width:352px}
.zw .sts{display:flex;flex-direction:row;justify-content:flex-start;gap:2px;flex-wrap:wrap}
.st{writing-mode:vertical-rl;text-orientation:upright;display:inline-flex;align-items:center;line-height:1;letter-spacing:.02em;padding:1px 0}
.st.mj{font-family:var(--f-display);font-weight:900;font-size:14px}
.st.mn{font-size:11.5px;font-weight:500}
.st i{font-style:normal;font-size:9.5px;font-weight:400;color:var(--mute);margin-top:2px}
.zw.ming .st i{color:var(--bg)}
.st .hua{writing-mode:horizontal-tb;font-style:normal;font-family:var(--f-mono);font-size:9.5px;border:1px solid currentColor;padding:0 1px;margin-top:2px;font-weight:400;line-height:1.2}
.zw .adj{font-size:10px;color:var(--mute);line-height:1.35}
.zw.ming .adj{color:var(--bg)}
.zw .adj .flow{color:var(--fg);font-weight:700;font-style:italic}
.zw.ming .adj .flow{color:var(--bg)}
.zw .ages{font-size:8.5px;color:var(--mute);line-height:1.3;margin-top:auto}
.zw.ming .ages{color:var(--bg)}
.zw .bot{display:grid;grid-template-columns:auto 1fr auto;gap:3px;align-items:end;font-size:10px;line-height:1.25}
.zw .gods{color:var(--mute);white-space:nowrap}
.zw .mid{min-width:0}
.zw .rt span{white-space:nowrap}
.zw.ming .gods{color:var(--bg)}
.zw .mid{display:flex;flex-direction:column;align-items:center;white-space:nowrap}
.zw .mid .mono{font-size:8px;letter-spacing:-.03em}
.zw .mid b{font-size:11.5px}
.zw .rt{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.zw .rt b{font-family:var(--f-display);font-size:13px;line-height:1.05}
.zw .tags{display:flex;gap:3px;flex-wrap:wrap}
.zw .tag{font-size:10px;border:1px solid currentColor;padding:0 2px;white-space:nowrap}
.zw .tag.solid{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.zw.ming .tag.solid{background:var(--bg);color:var(--fg)}
.zw[data-b]{cursor:pointer}
.zw.sf{background:var(--soft)}
.zw.pick{outline:2px solid var(--fg);outline-offset:-3px}
.zw.ming.pick{outline-color:var(--bg)}
.zw.flyin{background:var(--soft)}
.zw.ming.flyin,.zw.ming.sf{background:var(--fg)}
.st .hua.zi{border-style:solid;border-width:0 0 1px 0;padding:0}
.st .hua.fly{border-style:dashed;border-width:1.5px}
.zw .tag.dash{border-style:dashed}
.flytab{border-top:1px solid var(--line);padding-top:10px}
.flytab summary{cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:15px}
.tbl-scroll{overflow-x:auto;margin-top:8px}
.flytab table{border-collapse:collapse;font-size:11.5px;min-width:460px;width:100%}
.flytab th,.flytab td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;white-space:nowrap}
.flytab th{font-weight:500;color:var(--mute)}
.zrow>div.hrs{grid-template-columns:repeat(12,minmax(0,1fr))}
.c8{display:flex;gap:8px;font-family:var(--f-display);font-weight:900;font-size:16.5px;line-height:1.15;margin:2px 0}
.ovbox{font-size:11.5px;border:1px solid var(--fg);padding:3px 6px;margin-top:2px}
.zsel{display:flex;flex-direction:column;border-top:1px solid var(--fg)}
.zrow{display:grid;grid-template-columns:40px 1fr;border-bottom:1px solid var(--line);align-items:stretch}
.zrow>span{font-family:var(--f-display);font-weight:600;font-size:13px;display:flex;align-items:center}
.zrow>div{display:flex;overflow-x:auto;scrollbar-width:thin}
.zrow>div.days{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));overflow:visible}
.zrow button{flex:0 0 auto;min-width:60px;border:0;border-left:1px solid var(--line);background:transparent;padding:6px 4px;font-size:11.5px;line-height:1.3;font-family:var(--f-mono)}
.zrow .days button{min-width:0;font-family:var(--f-body);border-top:1px solid var(--line)}
.zrow button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.zrow button[aria-pressed="part"]{background:var(--soft);box-shadow:inset 0 -2px 0 var(--fg)}
.zw{border:1px solid var(--line);padding:5px 6px;font-size:11.5px;display:flex;flex-direction:column;gap:2px;min-width:0}
.zw .stars{font-family:var(--f-display);font-size:14px;font-weight:600;line-height:1.3;flex:1}
.zw .minor{color:var(--mute);font-size:11.5px}
.zw .foot{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;color:var(--mute)}
.zw .pn{font-size:11.5px;font-weight:700;color:var(--fg);font-family:var(--f-body)}
.zw.ming{background:var(--fg);color:var(--bg)}
.zw.ming .minor,.zw.ming .foot,.zw.ming .pn{color:var(--bg)}
.zw-center{grid-column:2/4;grid-row:2/4;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:4px;padding:8px;border:1px solid var(--line)}
.zw .misc{color:var(--mute);font-size:10.5px;line-height:1.35}
.zw.ming .misc{color:var(--bg)}
.zw .ovn{font-size:10.5px;font-weight:700;border:1px solid currentColor;padding:0 2px;white-space:nowrap}
.zw .pn{white-space:nowrap}
.zw .foot{gap:3px}
.zw.ovming{outline:2px dashed var(--fg);outline-offset:-5px}
.zw.ming.ovming{outline-color:var(--bg)}
.hua.ov{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.zw.ming .hua.ov{background:var(--bg);color:var(--fg);border-color:var(--bg)}
.zwctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.zwctl .seg{flex:1;min-width:220px}
.yearnav{display:flex;align-items:center;gap:6px}

.tstage::-webkit-scrollbar{display:none}
.ttrack{position:relative;height:100%}
.tback{all:unset;cursor:pointer;position:absolute;left:0;top:0;width:58px;aspect-ratio:7/12;border-radius:4px;overflow:hidden;transform-origin:50% 120%;box-shadow:0 2px 6px rgba(0,0,0,.35);will-change:transform}
.tback svg,.mini svg{width:100%;height:100%;display:block}
.tback .inkf,.mini .inkf{fill:#14152a}.tback .cb,.mini .cb{stroke:var(--gold)}.tback .cbf,.mini .cbf{fill:var(--gold)}
.tback.gone{opacity:0;pointer-events:none;transition:opacity .3s .15s,transform .32s!important}

.mini{all:unset;cursor:pointer;display:block;width:100%;height:100%;border-radius:4px;overflow:hidden;animation:tpop .45s cubic-bezier(.3,1.4,.4,1)}

:root[data-theme="light"] .tback .inkf,:root[data-theme="light"] .mini .inkf{fill:#2a2218}
.tbar{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--mute);margin-bottom:12px}
.tcard .front img{width:100%;height:100%;object-fit:cover;display:block}
.tcard .front.rev{transform:rotateY(180deg) rotate(180deg)}
.tcard .side{border-radius:6px;overflow:hidden}

@media (prefers-reduced-motion:reduce){.tdeck.shuffling .tback{animation:none}}

.tcard{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}

svg .ink{stroke:var(--fg);fill:none}

/* Nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--fg);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--bg) 70%,transparent);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.check input{width:auto}
@media (max-width:420px){

  .tl{grid-template-columns:56px 46px 1fr;gap:8px}
  .spread{gap:8px}
  .pillar .g{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.cosmic-weather strong{font-size:11.5px;font-weight:400}
/* daily */
.daily{border-top:1px solid var(--line);padding-top:34px;display:flex;flex-direction:column;gap:22px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.sec-head h2{font-family:var(--f-display);font-weight:300;font-size:24px;line-height:1.15;margin-top:10px}
.day-score{color:#77777b;font-size:9.5px;text-transform:uppercase;letter-spacing:.16em;text-align:right;white-space:nowrap}
.day-score strong{display:block;font-family:var(--f-display);color:var(--fg);font-size:30px;font-weight:400;letter-spacing:0;line-height:1}
.day-score small{color:#aba8e0;font-size:15.5px}
.insight-tabs{display:flex;flex-direction:column}
.insight-tabs button{color:#6c6c70;background:transparent;border:0;border-bottom:1px solid var(--line);padding:16px 6px;text-align:left;display:grid;grid-template-columns:28px 1fr auto;gap:14px;align-items:center;transition:.25s}
.insight-tabs button:first-child{border-top:1px solid var(--line)}
.insight-tabs button>span{font-family:var(--f-display);font-size:13px}
.insight-tabs button strong,.insight-tabs button small{display:block}
.insight-tabs button strong{color:#9a9998;font-family:var(--f-display);font-size:16px;font-weight:300;margin-bottom:2px}
.insight-tabs button small{font-size:9.5px;text-transform:uppercase;letter-spacing:.14em}
.insight-tabs button[aria-selected="true"]{color:var(--gold)}
.insight-tabs button[aria-selected="true"] strong{color:#efeef8}
.insight-tabs svg{width:18px;height:18px}
.insight-card{background:var(--surface);border:1px solid var(--line);padding:38px 24px 24px;position:relative;overflow:hidden;animation:reveal .4s ease both;display:flex;flex-direction:column;gap:16px}
.insight-card::after{content:"";position:absolute;width:240px;height:240px;right:-90px;top:-110px;border:1px solid rgba(173,170,236,.12);border-radius:50%;box-shadow:0 0 80px rgba(156,152,229,.05) inset}
.card-stars{position:absolute;right:18px;top:16px;color:rgba(187,184,244,.45);letter-spacing:.7em;font-size:11.5px}
.insight-card h3{font-family:var(--f-display);font-size:22px;line-height:1.3;font-weight:300}
.insight-card p.body{color:var(--mute2);font-size:14px;line-height:1.8;font-weight:300}
.card-footer{padding-top:16px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-footer span{display:flex;align-items:center;gap:9px;color:#8e8c8b;font-size:10.5px;text-transform:uppercase;letter-spacing:.15em}
.card-footer svg{width:17px;height:17px}
.text-button{color:var(--gold);display:inline-flex;gap:9px;align-items:center;border:0;background:transparent;font-size:11.5px;padding:0}
.text-button svg{width:16px;height:16px}
.yiji{border-color:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.yiji .big{font-family:"Noto Serif TC",serif;font-weight:400;color:var(--gold2)}
.yiji li{color:var(--mute2)}
.dots i{border-color:var(--gold)}
.dots i.on{background:var(--gold)}
/* sand panel */
.sand{background:var(--sand);color:var(--ink);padding:38px 24px;display:flex;flex-direction:column;gap:18px;margin-inline:-4px}
.sand .kicker{color:#605d8c}
.sand h2{font-family:var(--f-display);font-weight:300;font-size:26px;line-height:1.1}
.sand p{color:#555363;font-size:14px;line-height:1.8;font-weight:300}
.swatches{display:flex;align-items:center;justify-content:center;padding:6px 0}
.person{width:96px;height:96px;border:1px solid rgba(23,23,26,.4);border-radius:50%;display:flex;flex-direction:column;justify-content:center;align-items:center;font-family:"Noto Serif TC",serif;font-size:20px;position:relative}
.person span{font-family:var(--f-body);font-size:8px;text-transform:uppercase;letter-spacing:.2em;margin-top:4px}
.person+.person{margin-left:-12px}
.person.avoid::after{content:"";position:absolute;inset:46% -4px auto;border-top:1px solid rgba(23,23,26,.6);transform:rotate(-30deg)}
footer.s-foot{border-top:1px solid var(--line);padding-block:28px 10px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;color:#656569;font-size:10.5px;letter-spacing:.08em}
footer.s-foot .brand{color:#b6b1a9;font-size:11.5px}
/* other surfaces */
.wheel-box svg .inkf{fill:var(--gold2)}
.wheel-box text{fill:var(--fg)}
.pillars,.ziwei{border-color:var(--line)}
.pillar .g{font-family:"Noto Serif TC",serif}
.elbar .track{border-color:var(--line)}
.elbar .track span,.bar span{background:var(--gold)}
.bar{background:rgba(255,255,255,.08)}
.tiles{border-color:var(--line)}
.tiles button{background:transparent;border-color:var(--line)}
.tiles button[aria-pressed="true"]{background:var(--gold2);color:var(--hi-fg)}
.tiles button[aria-pressed="true"] small{color:#312e61}
.tiles button b{font-family:"Noto Serif TC",serif;font-weight:400}
.tiles button small{font-family:var(--f-latin);font-style:normal}
.zw{border-color:var(--line)}
.zw.ming{background:var(--gold2);color:var(--hi-fg)}
.zw.sf,.zw.flyin{background:rgba(183,180,235,.08)}
.zw.ming.sf,.zw.ming.flyin{background:var(--gold2)}
.zw.ovming{outline-color:var(--gold)}
.hua.ov,.st .hua.ov{background:var(--gold);color:var(--hi-fg);border-color:var(--gold)}
.zw.ming .hua.ov{background:var(--hi-fg);color:var(--gold2);border-color:var(--hi-fg)}
.zw .tag.solid{background:var(--gold);color:var(--hi-fg);border-color:var(--gold)}
.zw.ming .tag.solid{background:var(--hi-fg);color:var(--gold2)}
.zrow button[aria-pressed="true"]{background:var(--gold2);color:var(--hi-fg)}
.zrow button[aria-pressed="part"]{background:rgba(183,180,235,.1);box-shadow:inset 0 -2px 0 var(--gold)}
.months .now,.cal div[data-l="5"],.cal div[data-l="4"]{background:var(--gold2);color:var(--hi-fg);border-color:var(--gold2)}
.cal div[data-l="3"]{background:rgba(183,180,235,.12);border-color:rgba(183,180,235,.4)}
.legend .l5::before{background:var(--gold2)}
.tl.now{border-color:var(--gold)}
.dayrow.now{background:rgba(183,180,235,.07)}
.tcard .side{border-color:rgba(183,180,235,.5);background:var(--surface)}
.tcard .back svg .inkf{fill:#0f1013}
.tcard .back svg g{stroke:var(--gold)!important}
.tcard .back svg text{fill:var(--gold)!important}
.tcard .back .cbf{fill:var(--gold);stroke:none!important}
.sheet .panel{background:var(--surface2);border:1px solid rgba(255,255,255,.12)}
.mood-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.mood-grid button{border:1px solid var(--line);color:#9b9996;background:#1a1b20;padding:13px 5px;font-size:13px;transition:.2s;border-radius:0}
.mood-grid button:hover,.mood-grid button[aria-pressed="true"]{color:var(--hi-fg);background:#bab8ec;border-color:#bab8ec}
.modal-moon{width:55px;height:55px;margin:0 auto;color:#bab8ee;border:1px solid rgba(186,184,238,.3);border-radius:50%;display:grid;place-items:center}
.modal-moon svg{width:26px;height:26px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.1);opacity:.7}}
@keyframes twinkle{50%{opacity:.25;transform:scale(.55)}}
@keyframes reveal{from{opacity:0;transform:translateY(8px)}}
@media (max-width:420px){.s-hero h1{font-size:33px}.sec-head h2{font-size:24px}.insight-card h3{font-size:24px}}

/* ===== Co–Star style daily reading ===== */
.reading{display:flex;flex-direction:column;gap:18px;border-top:1px solid var(--line);padding-top:4px}
.day-strip{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line);margin-inline:-4px}
.day-strip button{background:none;border:0;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0 14px;font:inherit;font-size:10.5px;letter-spacing:.14em;cursor:pointer}
.day-strip b{font-weight:400;font-size:15px;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;letter-spacing:0;color:var(--fg)}
.day-strip button[aria-selected="true"]{color:var(--fg)}
.day-strip button[aria-selected="true"] b{background:var(--fg);color:var(--bg)}
.rd-h{font-family:var(--f-display);font-weight:300;font-size:25px;line-height:1.3;letter-spacing:.01em;margin-top:10px}
.pp{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;font-size:14px;color:var(--mute2)}
.pp li{display:flex;gap:12px;align-items:flex-start;line-height:1.6}
.ar-ic{font-size:15px;line-height:1.5;flex:none;width:20px;text-align:center}
.pp-k{font-style:normal;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-right:10px}
.ar-link{background:none;border:0;padding:0;font:inherit;color:var(--fg);text-decoration:underline;text-decoration-color:var(--mute);text-underline-offset:4px;text-decoration-thickness:1px;cursor:pointer}
.ar-link:hover{text-decoration-color:var(--fg)}
.rd-p{font-size:15.5px;line-height:1.85;color:var(--mute2);font-weight:400}
.rd-k{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold3);margin-bottom:4px}
.useful{display:flex;align-items:center;gap:18px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.16em;color:var(--mute)}
.useful button{background:none;border:0;color:var(--mute);padding:4px;cursor:pointer}
.useful button svg{width:20px;height:20px}
.useful button[aria-pressed="true"]{color:var(--fg)}
.transits{border-top:1px solid var(--line);padding-top:30px;display:flex;flex-direction:column}
.tr-row{display:grid;grid-template-columns:1fr 52px;gap:14px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:22px 0;color:inherit;font:inherit;cursor:pointer;width:100%}
.tr-t{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;color:var(--mute);text-transform:uppercase}
.tr-x{font-size:14px;line-height:1.75;color:var(--fg);font-weight:300;margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.read-sheet .tr-x{-webkit-line-clamp:unset;display:block}
.tr-s{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;color:var(--mute);margin-top:8px;text-transform:uppercase}
.tr-more{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;margin-top:12px;color:var(--fg)}
.tr-more svg{width:14px;height:14px}
.mini-orbit{width:52px;height:52px}
.mini-orbit.big{width:72px;height:72px;flex:none}
.mini-orbit .o1{fill:none;stroke:var(--line);stroke-dasharray:1 2}
.mini-orbit .o2{fill:none;stroke:var(--mute);stroke-width:.6;opacity:.6}
.mini-orbit .oc{fill:var(--mute)}
.mini-orbit .ot{fill:var(--gold)}
.mini-orbit .on{fill:none;stroke:var(--fg);stroke-width:1}
.mini-orbit .ol{stroke:var(--gold);stroke-width:.7}
.mini-orbit .ol.hard{stroke-dasharray:2 1.5}
.sh-top{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px}
.sh-title{text-align:center;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em}
.sh-h{font-family:var(--f-display);font-weight:300;font-size:24px;line-height:1.3;margin-top:8px}
.sh-p{font-size:14px;line-height:1.85;color:var(--mute2);font-weight:300}
.sh-zw{border:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute2)}
.tr-facts{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tr-facts div{padding:12px 0;display:flex;flex-direction:column;gap:4px;align-items:center}
.tr-facts span{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;color:var(--mute)}
.tr-facts b{font-weight:400;font-size:15px}
.read-sheet .tr-row{cursor:default}
.tr-dz{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tr-dz div{border:1px solid var(--line);padding:12px 14px}
.tr-dz span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;color:var(--gold3)}
.tr-dz p{font-size:13.5px;line-height:1.7;margin-top:4px;font-weight:300}
.tr-x{-webkit-line-clamp:5}
.theme-btn{width:32px;height:32px;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0}
.theme-btn svg{width:15px;height:15px}


.six{border-top:1px solid var(--line);padding-top:30px;display:flex;flex-direction:column}
.six .sec-head h2{font-size:20px}
.six-row{display:flex;flex-direction:column;gap:6px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:20px 0;color:inherit;font:inherit;cursor:pointer;width:100%}
.six-row:first-of-type{margin-top:16px;border-top:1px solid var(--line)}
.six-top{display:flex;align-items:center;gap:14px}
.six-n{font-family:var(--f-display);font-size:17px;font-weight:300;min-width:44px}
.six-tag{margin-left:auto;font-size:11.5px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--mute)}
.six-tag.power{border-color:var(--gold);color:var(--gold)}
.six-tag.trouble{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.six-h{font-size:15px;color:var(--fg);font-weight:400;margin-top:4px}
.six-x{font-size:13.5px;line-height:1.8;color:var(--mute2);font-weight:300}

/* month calendar: three clearly different states */
.cal div[data-k]{gap:1px;border-radius:6px}
.cal div[data-k] b{font-weight:500;font-size:11.5px}
.cal div[data-k] i{font-style:normal;font-size:9.5px;line-height:1}
.cal div[data-k="good"]{background:var(--gold2)!important;color:var(--hi-fg)!important;border:1px solid var(--gold2)!important}
.cal div[data-k="mid"]{background:transparent!important;color:var(--fg)!important;border:1px solid var(--gold)!important}
.cal div[data-k="mid"] i{color:var(--gold)}
.cal div[data-k="low"]{background:transparent!important;color:var(--mute)!important;border:1px dashed var(--line)!important;opacity:.75}
.legend{gap:10px 16px}
.legend span{display:inline-flex;align-items:center;gap:8px;color:var(--mute2)}
.legend span::before{display:none!important}
.legend span i{font-style:normal;width:22px;height:22px;border-radius:5px;display:grid;place-items:center;font-size:10.5px}
.legend [data-k="good"] i{background:var(--gold2);color:var(--hi-fg)}
.legend [data-k="mid"] i{border:1px solid var(--gold);color:var(--gold)}
.legend [data-k="low"] i{border:1px dashed var(--mute);color:var(--mute)}

.feel{display:flex;flex-wrap:wrap;gap:8px}
.feel button{border:1px solid var(--line);background:transparent;color:var(--mute2);border-radius:999px;padding:6px 12px;font:inherit;font-size:11.5px;cursor:pointer}
.feel button[aria-pressed="true"]{background:var(--gold2);color:var(--hi-fg);border-color:var(--gold2)}
.djournal{border-top:1px solid var(--line);padding-top:26px;margin-top:10px;display:flex;flex-direction:column;gap:14px}
.dj-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.dj-t{font-family:var(--f-display);font-weight:300;font-size:20px;margin-top:6px}
.dj-where{font-size:11.5px;text-align:right}
.dj-stats{display:grid;grid-template-columns:auto auto 1fr;gap:18px;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0}
.dj-stats>div:not(.dj-sym){display:flex;flex-direction:column;align-items:center}
.dj-stats b{font-family:var(--f-display);font-weight:300;font-size:24px;line-height:1}
.dj-stats span{font-size:11.5px;color:var(--mute)}
.dj-sym{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:11.5px;color:var(--mute2)}
.chip.on{border-color:var(--gold);color:var(--gold)}
.dj-month{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;color:var(--gold3);margin-top:8px}
.dj-row{display:grid;grid-template-columns:44px 1fr;gap:14px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0;color:inherit;font:inherit;cursor:pointer;width:100%}
.dj-d{display:flex;flex-direction:column;align-items:center;font-size:11.5px;color:var(--mute)}
.dj-d b{font-family:var(--f-display);font-weight:300;font-size:20px;color:var(--fg);line-height:1.1}
.dj-x{display:flex;flex-direction:column;gap:8px;min-width:0}
.dj-txt{font-size:14px;line-height:1.7;font-weight:300;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dj-tags{display:flex;flex-wrap:wrap;gap:6px}

.back-link{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mute);text-decoration:none;margin-bottom:-10px}
.back-link svg{width:14px;height:14px;transform:rotate(180deg)}
.pats{gap:0}
.pat{border-bottom:1px solid var(--line);padding:14px 0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline}
.pat b{font-family:var(--f-display);font-weight:400;font-size:16px}
.pat span{font-size:11.5px;color:var(--mute);justify-self:end;border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.pat.g span{color:var(--gold);border-color:var(--gold)}
.pat.b span{color:var(--fg);border-color:var(--fg)}
.pat p{grid-column:1/-1;font-size:13.5px;line-height:1.75;color:var(--mute2);font-weight:300}

.wk-ar{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mute2);margin-top:4px}
.mlist{display:flex;flex-direction:column}
.mrow{display:grid;grid-template-columns:56px 1fr;gap:12px;border-bottom:1px solid var(--line);padding:14px 0}
.mrow.now{background:color-mix(in srgb,var(--gold) 6%,transparent)}
.mr-d{display:flex;flex-direction:column;align-items:center;gap:6px}
.mr-d i{font-style:normal;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:11.5px}
.mrow[data-k="good"] .mr-d i{background:var(--gold2);color:var(--hi-fg)}
.mrow[data-k="mid"] .mr-d i{border:1px solid var(--gold);color:var(--gold)}
.mrow[data-k="low"] .mr-d i{border:1px dashed var(--mute);color:var(--mute)}
.mr-x p{font-size:13px;line-height:1.7;color:var(--mute2)}
.mr-x p:first-child{display:flex;gap:8px;align-items:center;color:var(--fg);font-size:14px}
.mr-x b{font-weight:400}
/* ===== Light tone ===== */
:root[data-theme="light"]{--bg:#f7f6f3;--surface:#ffffff;--surface2:#fbfaf8;--fg:#14131b;--mute:#6a6873;--mute2:#3d3b46;--line:rgba(28,27,36,.11);--soft:#efeee9;
  --gold:#a87b37;--gold2:#2a2218;--gold3:#a87b37;--sand:#efe3cc;--ink:#1c1b24;--hi:#2a2218;--hi-fg:#f7f6f3;color-scheme:light}
:root[data-theme="light"] #skybg{opacity:.6}
:root[data-theme="light"] .profile-orbit::after{background:var(--gold);box-shadow:none}
:root[data-theme="light"] .profile-orbit,:root[data-theme="light"] .btn{border-color:rgba(28,27,36,.18)}
:root[data-theme="light"] .btn:hover{background:rgba(28,27,36,.05)}
:root[data-theme="light"] .btn.solid:hover,:root[data-theme="light"] .primary-button:hover{background:#4a3c28}
:root[data-theme="light"] .primary-button{color:var(--hi-fg)}
:root[data-theme="light"] nav.tabs a,:root[data-theme="light"] .date-line span,:root[data-theme="light"] .orbit-label,:root[data-theme="light"] .insight-tabs button,:root[data-theme="light"] .insight-tabs button strong,:root[data-theme="light"] .card-footer span,:root[data-theme="light"] .cosmic-weather span,:root[data-theme="light"] .day-score{color:var(--mute)}
:root[data-theme="light"] .date-line span{border-left-color:var(--line)}
:root[data-theme="light"] .insight-tabs button[aria-selected="true"] strong{color:var(--fg)}
:root[data-theme="light"] .orb-core{background:rgba(255,255,255,.78);border-color:rgba(168,123,55,.35);color:var(--mute2);box-shadow:0 0 40px rgba(168,123,55,.12)}
:root[data-theme="light"] .orb-sign{color:var(--gold2)}
:root[data-theme="light"] .orb-aura{background:radial-gradient(circle,rgba(168,123,55,.12),transparent 70%)}
:root[data-theme="light"] .realsky .field circle{fill:#4a3c28}

  const at=ms=>{const p={};fmt.formatToParts(new Date(ms)).forEach(x=>p[x.type]=x.value);return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute)};
  let guess=Date.UTC(y,m-1,d,h,mi);let off=(at(guess)-guess)/60000;
  off=(at(guess-off*60000)-(guess-off*60000))/60000;return off;
}

function productPrompt(p){return prompt(`為使用者撰寫一份付費深入報告「${p.n}」。按以下章節逐一詳細撰寫，每章用「## 章節名」做小標題：${p.secs.join("、")}。結合八字（格局、喜忌、大運）、紫微斗數（相關宮位主星、四化、大限）同西洋星盤（相關行星、宮位、相位），每章至少一段具體分析同一個可以實行嘅建議。語氣溫暖、親切、具體，全文約 900–1300 字。`,chart)}

    <div class="tiles" role="group" aria-label="占卜方法">${[["tarot","塔羅","Tarot · 타로"],["shin","神占","Mudang · 신점"],["face","面相手相","Face & Palm"],["ifa","Ifá 占卜","Yorùbá Opele"],["runes","盧恩符文","Witch Runes"]].filter(([k])=>k!=="face"||IN_CLAUDE).map(([k,n,e])=>`<button type="button" data-or="${k}">${ORICON[k]}<b>${n}</b><small>${e}</small></button>`).join("")}</div>

    const mp=$("#morePk",body);if(mp)mp.onclick=()=>{location.hash="#shop"};

    const mine=PRODUCTS.filter(x=>owns(x.k));
    body.innerHTML=`<div class="stack"><span class="eyebrow">我的報告</span>${mine.length?`<div class="pgrid">${mine.map(x=>`<button type="button" class="pcard" data-pk="${x.k}"><small>${esc(x.en)}</small><b>${esc(x.n)}</b><span class="mute">撳入去睇完整報告</span></button>`).join("")}</div>`:`<p class="mute" style="font-size:14px">你仲未解鎖任何報告。想更深入了解自己，可以去<a href="#shop">商店</a>睇吓。</p>`}</div>
    <hr class="rule"><div class="stack"><span class="eyebrow">夢境日記</span><div id="savedDreams"><p class="mute">載入中⋯</p></div><div class="row"><button type="button" class="btn" id="newDream">記錄新嘅夢</button></div></div>`;
    body.querySelectorAll("[data-pk]").forEach(b=>b.onclick=()=>openProduct(b.dataset.pk));
    $("#newDream",body).onclick=()=>{location.hash="#dream"};
    (async()=>{const box=$("#savedDreams",body);try{const st=await dreamStore();const all=(await st.list()).sort((a,b)=>(b.date+(b.created||"")).localeCompare(a.date+(a.created||"")));
      box.innerHTML=all.length?`<ul class="saved-list">${all.slice(0,12).map(d=>`<li><span class="mono mute">${esc(d.date||"")}</span><span>${esc((d.text||"").slice(0,60))}${(d.text||"").length>60?"⋯":""}</span>${d.interp?`<em>已解夢</em>`:""}</li>`).join("")}</ul>${all.length>12?`<p class="mute" style="font-size:13px">仲有 ${all.length-12} 個夢，喺「夢」頁可以睇晒。</p>`:""}`:`<p class="mute" style="font-size:14px">仲未有記錄。發完夢記低佢，日後可以睇返。</p>`}catch(e){box.innerHTML=`<p class="note">暫時載入唔到，請稍後再試。</p>`}})();
    return;

  body.innerHTML=`<button type="button" class="shop-entry" id="goShop"><span><span class="kicker">Soluna 商店</span><b>${isMember()?`你係 ${TIER[ENT.tier].full} 會員 ✦`:"更深入了解你自己"}</b><span class="mute">Luna Plus、Sol Pro 會員、愛情、事業、財運同年度報告</span></span><span aria-hidden="true">→</span></button>
  <div class="set-list">
    <button type="button" id="setEdit"><span>出生資料</span><span class="mute">修改 →</span></button>
    <button type="button" id="setTheme"><span>外觀</span><span class="mute">${isLight()?"淺色":"深色"} · 切換 →</span></button>

  <p><b>占卜型</b>：78 張偉特塔羅（親手揀牌）、韓國神占（擲米）、西非 Ifá Opele、北歐盧恩符文。</p><p><b>夢境</b>：解夢同夢境日記。</p>

  <p class="note">${BRAND.zh}的內容供娛樂和自我反思之用。重要的健康、法律及財務決定，請諮詢相關專業人士。</p>`;

  const r=$("#reset",body);if(r)r.onclick=()=>{profile={...DEMO};store("xuanjing.profile.v1",profile);recompute();route()};

function openEditor(){
  const sh=$("#sheet");const p=profile.demo?{...DEMO,name:"",demo:true}:profile;
  sh.innerHTML=`<form class="panel" id="pf" autocomplete="off"><div class="row" style="justify-content:space-between"><h2>你的出生資料</h2><button type="button" class="btn small" id="close">關閉</button></div>

/* ============ router ============ */
function renderDream(el){
  el.innerHTML=`<div class="stack"><span class="eyebrow">夢境 · Dream journal</span><h1>記住每一個夢<span class="lat">dreams, kept</span></h1></div><div id="drBody" class="stack" style="gap:22px"></div>`;

const VIEWS={today:renderToday,forecast:renderForecast,chart:el=>{meTab="chart";renderMe(el)},dream:renderDream,oracle:renderOracle,me:renderMe,shop:renderShop};

  const hp=document.getElementById("hdrProfile");if(hp)hp.textContent=(profile.demo?"示":(profile.name||"我")).slice(0,1);
  const v=(location.hash||"#today").slice(1);const key=VIEWS[v]?v:"today";
  document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current",a.dataset.v===(key==="oracle"||key==="chart"?"me":key)?"page":"false"));
  const shx=$("#sheet");if(shx)shx.hidden=true;
  const main=$("#main");main.innerHTML="";const sec=document.createElement("section");sec.className="view";main.appendChild(sec);
  try{VIEWS[key](sec)}catch(e){sec.innerHTML=`<p class="note">這一頁暫時未能顯示：${esc(e.message)}。請重新整理。</p>`;console.error(e)}

const THEME_IC={light:'<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',dark:'<svg class="ic" viewBox="0 0 24 24"><path d="M20 15.2A8.5 8.5 0 0 1 8.8 4a8.5 8.5 0 1 0 11.2 11.2Z"/></svg>'};

function boot(){
  const n=new Date();$("#hdrDate").innerHTML=`${n.getFullYear()}.${String(n.getMonth()+1).padStart(2,"0")}.${String(n.getDate()).padStart(2,"0")}<br>${window.Solar?Solar.fromDate(n).getLunar().getDayInGanZhi()+"日":""}`;
  if(!window.Solar){$("#main").innerHTML=`<p class="note" style="margin-top:24px">曆法程式庫未能載入，請檢查網絡後重新整理。</p>`;return}
